name: Update Writing page

on:
  # Daily schedule paused until the Cloudflare Worker relay is confirmed working.
  # To resume, remove the "#" from the next two lines.
  # schedule:
  #   - cron: "17 11 * * *" # daily, about 7am Eastern
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add new Substack posts
        env:
          SUBSTACK_FEED_URL: "" # the Cloudflare Worker address goes here
        run: python scripts/update_writing.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- writing.html; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.html
          git commit -m "Add new Ground Truth posts to the Writing page"
          git push
          # Make sure GitHub Pages rebuilds after a push made by this workflow.
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped; the push will still deploy normally."
