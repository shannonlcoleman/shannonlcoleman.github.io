name: Update Writing page

on:
  schedule:
    - cron: "17 17 * * *" # daily, about 1pm Eastern (noon in winter)
    - cron: "47 20 * * *" # backup run, about 4:45pm Eastern, in case the first one can't reach Substack
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: update-writing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Add new Substack posts
        id: update
        env:
          SUBSTACK_FEED_URL: "https://ground-truth-feed.4slcole.workers.dev" # Cloudflare Worker relay (scripts/substack-feed-worker.js)
        run: python scripts/update_writing.py

      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- writing.html index.html sitemap.xml; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add writing.html index.html sitemap.xml
          git commit -m "Add new Ground Truth posts to the Writing page"
          git push
          # Make sure GitHub Pages rebuilds after a push made by this workflow.
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped; the push will still deploy normally."

      - name: Ask for a description for any new series
        if: steps.update.outputs.new_series != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SERIES: ${{ steps.update.outputs.new_series }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Add a description for ${NEW_SERIES}" \
            --body "The Writing page has a new series section. Its description is a placeholder copied from the intro post's subtitle. Write a two- or three-sentence description to replace it, then close this issue. (Opened automatically by the Update Writing page job.)" \
            || echo "Could not open a reminder issue."
